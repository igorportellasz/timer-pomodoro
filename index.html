<!doctype html>
<html lang="en">
  <head>
    <!-- Define a codificação de caracteres para garantir que todos os caracteres sejam exibidos corretamente -->
    <meta charset="UTF-8" />
    
    <!-- Estabelece a conexão prévia com o Google Fonts para otimizar o carregamento -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Tornar a página responsiva para diferentes tamanhos de tela (como em dispositivos móveis) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Importação das fontes do Google Fonts: 'Roboto Mono' para estilo de fonte monoespaçada e 'Roboto' para fonte padrão -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Título da página que aparecerá na aba do navegador -->
    <title>Pomodoro Timer</title>
  </head>
  <body>
    <!-- O elemento 'div' com id="root" é onde a aplicação React será montada -->
    <div id="root"></div>
    
    <!-- Importação do arquivo principal da aplicação React (main.tsx), que será compilado e executado -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
